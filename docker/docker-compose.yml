services:
  postgres:
    image: postgres:16
    container_name: lexpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: lexpilot
      POSTGRES_PASSWORD: lexpilot_password
      POSTGRES_DB: lexpilot_db
    ports:
      - "5432:5432"
    volumes:
      - lexpilot_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lexpilot_redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: lexpilot_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lexpilot
      MINIO_ROOT_PASSWORD: lexpilot_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lexpilot_minio:/data

volumes:
  lexpilot_pgdata:
  lexpilot_minio:
